plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.roccoapps.bloccoapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.roccoapps.bloccoapp"
        minSdk 26
        targetSdk 34
        // In CI versionCode = numero della build: ogni build pubblicata è "più nuova".
        def runNum = System.getenv("GITHUB_RUN_NUMBER")
        versionCode runNum ? runNum.toInteger() : 1
        versionName "1.0." + (runNum ?: "0")
        // Canale di aggiornamento: release "latest" del repo pubblico.
        buildConfigField "String", "UPDATE_REPO", "\"rocco92rc-png/blocco-app\""
    }

    signingConfigs {
        // Chiave dedicata solo a questa app (nel repo). Serve solo a far sì che ogni
        // aggiornamento abbia la stessa firma e si installi sopra mantenendo i dati.
        release {
            storeFile file('bloccoapp.p12')
            storeType 'pkcs12'
            storePassword 'bloccoapp'
            keyAlias 'bloccoapp'
            keyPassword 'bloccoapp'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint { abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { compose true; buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui:1.7.3'
    implementation 'androidx.compose.foundation:foundation:1.7.3'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}
